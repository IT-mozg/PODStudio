[pytest]
# `.` on the path so tests can `import models` without the package being
# installed - this app is run straight from the checkout (python3 app.py),
# never pip-installed.
pythonpath = .
testpaths = tests
# Concurrency tests spawn threads; a hung one should fail the run rather than
# block it forever. Every test here has its own inner timeout too.
addopts = -q
